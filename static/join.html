<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>加入会话 · 合拍 Cojam</title>
<link rel="icon" href="/static/icon-192.png"><link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="theme-color" content="#6022e8">
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color-scheme:light dark;background:#151517;color:#ececf1}*{box-sizing:border-box}body{margin:0;height:100dvh;display:grid;grid-template-columns:260px 1fr}aside{padding:24px 16px;background:#1b1b1e;border-right:1px solid #333;overflow:auto}h2{font-size:18px}small{color:#aaa}button,input,textarea{font:inherit;padding:10px;border:1px solid #444;border-radius:8px;background:#232328;color:inherit}input{width:100%;margin:12px 0}button{cursor:pointer}#list button{display:block;width:100%;text-align:left;margin:8px 0}#list button.on{border-color:#6495ff;background:#263656}main{display:flex;flex-direction:column;min-width:0;padding:24px;overflow:hidden}#feed{flex:1;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.msg{padding:16px 0;border-bottom:1px solid #333}.who{font-size:12px;color:#aaa;margin-bottom:6px}form{display:flex;gap:8px;padding-top:16px}textarea{flex:1;resize:vertical}#error{color:#fca5a5;white-space:pre-wrap}#status{color:#aaa} @media(max-width:650px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{padding:12px;max-height:32vh}main{padding:16px}h2{margin:0}#list button{display:inline-block;width:auto}}
</style>
<link rel="stylesheet" href="/static/guest.css">
<aside><h2 class="guest-brand"><img src="/static/logo.svg" width="36" height="36" alt=""><span>cojam<small>合拍 · 一起参与</small></span></h2><small>打开邀请，加入这次合拍。</small><label class="key-label" for="key">联系人接入密钥</label><input id="key" type="password" placeholder="粘贴邀请中的密钥" autocomplete="off"><button id="connect">加入会议室</button> <button id="logout">退出</button><p id="identity"></p><div id="list" aria-label="已受邀的会话"></div><p id="error" role="alert"></p></aside>
<main><h2 id="title">选择一个会话</h2><p id="status">请向应用管理员索取联系人密钥。</p><div id="feed" aria-live="polite"></div><form id="send"><textarea id="text" placeholder="输入消息…" disabled></textarea><button id="submit" disabled>发送</button></form></main>
<script>
let token='',rid='',since=0,generation=0,permission=false,busy=false;
const el=id=>document.getElementById(id);
async function request(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}
function clear(){generation++;rid='';since=0;permission=false;el('feed').replaceChildren();el('text').value='';el('text').disabled=el('submit').disabled=true;el('title').textContent='选择一个会话'}
async function refresh(){if(!token)return;const gen=generation;try{const j=await request('/api/external/rooms');if(gen!==generation)return;el('identity').textContent=j.contact.label+' · '+(j.contact.kind==='user'?'用户':'Harness');el('list').replaceChildren();for(const room of j.rooms){const b=document.createElement('button');b.textContent=room.title;b.classList.toggle('on',room.id===rid);b.onclick=()=>{clear();rid=room.id;el('title').textContent=room.title;poll();refresh()};el('list').append(b)}if(rid&&!j.rooms.some(r=>r.id===rid)){clear();el('status').textContent='此会话的访问权限已撤销'}else if(!rid)el('status').textContent=j.rooms.length?'选择左侧会话开始交流':'还没有受邀的会话，请联系管理员。';el('error').textContent=''}catch(e){clear();el('list').replaceChildren();el('error').textContent=e.message}}
async function poll(){if(!rid||busy)return;const gen=generation,room=rid;busy=true;try{const j=await request('/api/external/messages?room='+encodeURIComponent(room)+'&since='+since);if(gen!==generation)return;for(const m of j.messages){const box=document.createElement('div');box.className='msg';const who=document.createElement('div');who.className='who';who.textContent=m.speaker+' · '+m.time;const text=document.createElement('div');text.textContent=m.text;box.append(who,text);el('feed').append(box)}if(j.messages.length)el('feed').scrollTop=el('feed').scrollHeight;since=j.next;permission=j.permissions.post;el('text').disabled=el('submit').disabled=!permission;el('status').textContent=permission?'以自己的联系人身份发言':'此会话为只读'}catch(e){if(gen===generation){clear();el('error').textContent=e.message}}finally{busy=false}}
async function connectClient(key){clear();token=key.trim();el('key').value='';el('error').textContent='';try{await request('/api/external/hello',{client:'AI Bridge 网页'});await refresh()}catch(e){token='';el('error').textContent=e.message}}
el('connect').onclick=()=>connectClient(el('key').value);el('logout').onclick=()=>{token='';clear();el('list').replaceChildren();el('identity').textContent='';el('status').textContent='已退出'};
el('send').onsubmit=async e=>{e.preventDefault();const text=el('text').value.trim(),room=rid,gen=generation;if(!text||!permission)return;el('submit').disabled=true;try{await request('/api/post',{room,text});if(gen===generation){el('text').value='';await poll()}}catch(e){el('error').textContent=e.message}finally{el('submit').disabled=!permission}};
setInterval(poll,1500);setInterval(refresh,5000);
let invitationKey=new URLSearchParams(location.hash.slice(1)).get('key');if(invitationKey){history.replaceState(null,'',location.pathname+location.search);connectClient(invitationKey);invitationKey=''}
</script></html>
