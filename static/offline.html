<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>合拍暂时离线</title>
<style>
:root{--bg:#fcfbff;--fg:#272136;--mut:#726a82;--btn:#6022e8}
@media(prefers-color-scheme:dark){:root{--bg:#171e1c;--fg:#e4ece4;--mut:#a8b5ab;--btn:#6022e8}}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:24px;box-sizing:border-box}
main{max-width:420px;text-align:center}
img{width:72px;height:72px;border-radius:18px}
h1{font-size:19px;margin:16px 0 8px}
p{color:var(--mut);margin:0 0 18px}
button{font:inherit;font-weight:600;padding:9px 22px;border:0;border-radius:10px;background:var(--btn);color:#fff;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/static/icon-192.png" alt="">
  <h1>合拍暂时离线</h1>
  <p>电脑上的会议室服务没在跑。在电脑上双击桌面的「合拍 Cojam」图标（或运行 start.bat），开好后点下面重试。</p>
  <button type="button" onclick="location.reload()">重试</button>
</main>
</body>
</html>
