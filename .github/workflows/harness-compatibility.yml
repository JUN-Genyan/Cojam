name: Harness compatibility
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portable discovery and adapter contracts
        run: python -m unittest discover -s tests -p test_harness_catalog.py
      - name: Catalog API and identity isolation
        run: python -m unittest discover -s tests -p test_catalog_api.py
      - name: Member execution and reconnection
        run: python -m unittest discover -s tests -p test_members.py
      - name: Model controls and stale responses
        run: python -m unittest discover -s tests -p test_model_settings.py
